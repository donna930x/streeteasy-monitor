name: StreetEasy Monitor

on:
  # The scheduled cloud run is DISABLED: GitHub's datacenter IPs are hard-blocked
  # by StreetEasy (HTTP 403). The monitor now runs locally via a launchd
  # LaunchAgent (see cron/install_launchd.sh). Re-enable this schedule only if
  # you add a working SCRAPER_PROXY_URL.
  # schedule:
  #   - cron: '*/20 12-23,0-3 * * *'
  workflow_dispatch:  # still allows manual trigger from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Restore the SQLite DB from cache so we don't re-alert on seen listings.
      # Cache key is fixed so it accumulates across runs; bust it manually if needed.
      - name: Restore listing database
        uses: actions/cache@v4
        with:
          path: data/db.sqlite3
          key: streeteasy-db-v2
          restore-keys: |
            streeteasy-db-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GMAIL_ADDRESS:         ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL:        ${{ secrets.ALERT_TO_EMAIL }}
          SHEETS_WEBHOOK_URL:    ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_SECRET: ${{ secrets.SHEETS_WEBHOOK_SECRET }}
          SHEET_URL:             ${{ secrets.SHEET_URL }}
          SCRAPER_PROXY_URL:     ${{ secrets.SCRAPER_PROXY_URL }}
        run: python main.py

      # Save updated DB back to cache after each run
      - name: Save listing database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/db.sqlite3
          key: streeteasy-db-v2-${{ github.run_id }}
